<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompter — REVISE Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ED1C24; --red-dark:#C8141B; --ink:#1A1917; --white:#FFFFFF;
  --card-bg:#F5F3EF; --card-border:#E8E5E0; --mid:#9A9590;
  --yellow:#FFE600; --delta:rgba(237,28,36,.13);
  --radius-sm:8px; --radius-md:12px; --radius-lg:14px; --radius-pill:100px;
}
*{box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--red);min-height:100vh;margin:0;color:var(--ink);}
::selection{background:var(--yellow);color:var(--ink);}

.lab-bar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--ink);color:#fff;font-size:11px;letter-spacing:.4px;}
.lab-bar .tag{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;}
.lab-bar .muted{color:rgba(255,255,255,.55);}
.lab-bar .spacer{flex:1;}
.lab-bar button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:var(--radius-pill);padding:5px 13px;font-size:10px;font-weight:600;cursor:pointer;letter-spacing:.5px;}
.lab-bar button:hover{border-color:#fff;}

/* stage: artefact (left) + human rail (right) */
.stage{display:flex;justify-content:center;align-items:flex-start;gap:16px;padding:32px 24px 60px;}
.cardwrap{flex:0 1 600px;min-width:0;}
.rail{flex:0 0 320px;position:sticky;top:24px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;gap:16px;}

/* profile card — the artefact, now button-free */
.profile-zone{background:#fff;border-radius:var(--radius-lg);overflow:hidden;}
.profile-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:.5px solid var(--card-border);}
.profile-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--ink);}
.profile-title span{color:var(--red);}
/* card view toggle — screen chrome, stripped on PDF export ([data-noexport]) */
.view-toggle{display:inline-flex;flex:0 0 auto;border:1px solid var(--red);border-radius:var(--radius-pill);overflow:hidden;}
.vt{background:none;border:none;color:var(--red);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s,color .15s;}
.vt.active{background:var(--red);color:#fff;}
.vt:not(.active):hover{background:rgba(237,28,36,.08);}
.prompt-view{padding:20px 18px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.75;white-space:pre-wrap;color:#111;}
.psec{padding:12px 18px;border-bottom:.5px solid var(--card-border);}
.psec:last-of-type{border-bottom:none;}
.plbl{font-size:8px;font-weight:700;color:var(--red);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;}
.pbody{font-size:12px;color:var(--ink);line-height:1.75;font-weight:300;}
.ptable{width:100%;border-collapse:collapse;margin-top:4px;table-layout:fixed;}
.ptable th{font-size:8px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:5px 8px;background:var(--ink);color:#fff;text-align:left;}
.ptable td{font-size:11px;padding:6px 8px;border-bottom:.5px solid var(--card-border);font-weight:300;color:var(--ink);line-height:1.45;vertical-align:top;word-wrap:break-word;}
.ptable th:first-child,.ptable td:first-child{width:55%;}
.ptable th:last-child,.ptable td:last-child{width:45%;}
.ptable tr:nth-child(even) td{background:var(--card-bg);}
.ptable tr:last-child td{border-bottom:none;}
.ptable td:first-child{font-weight:500;}
.ptable td.foil{color:var(--mid);}
.rules-list{display:flex;flex-direction:column;gap:4px;margin-top:3px;}
.rule-item{display:flex;gap:10px;font-size:11px;line-height:1.5;font-weight:300;align-items:baseline;}
.rule-key{font-weight:600;flex:0 0 130px;color:var(--ink);overflow-wrap:break-word;}
.rule-val{flex:1;}
.footer-row{display:flex;align-items:center;gap:12px;}
.footer-logo{height:20px;width:auto;opacity:.9;flex:0 0 auto;}
.footer-note{font-size:10px;color:var(--mid);}

/* highlighter (yellow) + delta (brand red) */
mark.hl{background:var(--yellow);color:var(--ink);border-radius:2px;padding:0 1px;}
mark.changed{background:var(--delta);color:var(--ink);border-radius:2px;padding:0 1px;box-shadow:inset 0 -1px 0 rgba(237,28,36,.45);}

/* editable blocks */
.editable{position:relative;border-radius:6px;transition:background .15s;}
.editable:hover{background:rgba(237,28,36,.035);}
.pencil{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:none;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--mid);cursor:pointer;opacity:0;transition:opacity .15s,color .15s;
  display:flex;align-items:center;justify-content:center;z-index:2;}
.editable:hover .pencil{opacity:1;}
.pencil:hover{color:var(--red);}
.pencil svg{width:12px;height:12px;}
.psec.editable .pencil{top:10px;right:10px;}
tr.editable td{position:relative;}
tr.editable .pencil{top:4px;right:4px;}
.rule-item.editable .pencil{top:0;right:0;}
.editable.active{background:rgba(237,28,36,.05);box-shadow:inset 0 0 0 1px rgba(237,28,36,.3);}
.editable.preview{background:rgba(237,28,36,.05);box-shadow:inset 0 0 0 1px rgba(237,28,36,.4);}

/* ── RAIL: idle (the human's resting column) ─────────────────── */
.rail-idle{display:flex;flex-direction:column;gap:16px;overflow-y:auto;padding-right:2px;}
/* sensecheck hero — pulled onto the red, mirroring the welcome page */
.sc-hero{padding:4px 4px 0;}
.sc-eyebrow{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px;}
.sc-hed{font-family:'Bebas Neue',sans-serif;font-size:58px;letter-spacing:0;line-height:.82;color:#fff;}
.sc-hed .tweak{color:rgba(255,255,255,.42);}
.sc-intro{font-size:13px;line-height:1.5;color:rgba(255,255,255,.85);font-weight:400;margin:14px 4px 0;}
/* Dot, in a box below — mirrors the welcome bubble (avatar on red, white bubble) */
.sc-dot{display:flex;gap:10px;align-items:flex-start;}
.sc-dot-av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:17px;letter-spacing:1px;}
.sc-dot-bubble{flex:1;background:#fff;border-radius:14px;border-top-left-radius:4px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--ink);font-weight:400;}
/* single download — takes both faces at once */
/* persistent footer — the exit, always visible, even mid-tweak */
.rail-foot{flex:0 0 auto;}
.gtg{background:var(--card-bg);border-radius:var(--radius-lg);padding:16px 16px 14px;text-align:left;}
.gtg-hed{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;line-height:1;color:var(--mid);margin-bottom:11px;}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--radius-pill);padding:11px 18px;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:background .15s;font-family:inherit;}
.dl-btn:hover{background:var(--red-dark);}
.dl-btn svg{width:16px;height:16px;}
.dl-cap{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mid);margin-top:9px;}
.actions{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:var(--radius-lg);padding:14px 16px;}
.act{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border-radius:var(--radius-pill);padding:9px 16px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border:none;}
.act svg{width:14px;height:14px;flex-shrink:0;}
.act.ghost{background:none;border:1px solid var(--card-border);color:var(--ink);}
.act.ghost:hover{border-color:var(--ink);}
.act.solid{background:var(--ink);color:#fff;}
.act.solid:hover{background:var(--red);}
.act.disabled{background:none;border:1px dashed var(--card-border);color:var(--mid);cursor:default;}
.act.disabled:hover{border-color:var(--card-border);}
.soon{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mid);border:1px solid var(--card-border);border-radius:3px;padding:1px 4px;margin-left:2px;}
/* tweaks made — the receipt of the sensecheck */
.tweaks-made{background:#fff;border-radius:var(--radius-lg);overflow:hidden;}
.tm-head{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;cursor:pointer;padding:13px 16px;font-family:inherit;}
.tm-count{font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;}
.tm-count .tick{color:var(--red);font-weight:700;}
.tm-chev{font-size:10px;color:var(--mid);transition:transform .2s;}
.tweaks-made.open .tm-chev{transform:rotate(180deg);}
.tm-list{display:none;flex-direction:column;border-top:.5px solid var(--card-border);}
.tweaks-made.open .tm-list{display:flex;}
.tw-item{padding:9px 16px;border-bottom:.5px solid var(--card-border);}
.tw-item:last-child{border-bottom:none;}
.tw-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--red);margin-bottom:3px;}
.tw-why{font-size:11px;line-height:1.5;color:var(--ink);font-weight:300;}

/* ── RAIL: chat (becomes Dot on tweak) ───────────────────────── */
.rail-chat{display:none;flex-direction:column;flex:1;min-height:0;background:#fff;border-radius:var(--radius-lg);box-shadow:0 12px 40px rgba(0,0,0,.16);overflow:hidden;}
.stage.editing .rail-idle{display:none;}
.stage.editing .rail-chat{display:flex;}
.dp-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:.5px solid var(--card-border);}
.dp-dot{width:30px;height:30px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Bebas Neue';font-size:15px;letter-spacing:1px;}
.dp-title{font-weight:600;font-size:13px;}
.dp-sub{font-size:10px;color:var(--mid);}
.dp-x{margin-left:auto;background:none;border:none;color:var(--mid);font-size:18px;cursor:pointer;line-height:1;}
.dp-x:hover{color:var(--ink);}
.dp-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.msg{font-size:12px;line-height:1.6;max-width:88%;padding:9px 12px;border-radius:12px;font-weight:300;white-space:pre-line;}
.msg.dot{background:var(--card-bg);color:var(--ink);align-self:flex-start;border-bottom-left-radius:3px;}
.msg.dot.pb{background:#fff;outline:1px solid var(--red);}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
.proposal{align-self:flex-start;max-width:92%;background:#fff;border:1px solid var(--red);border-radius:12px;border-bottom-left-radius:3px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--ink);}
.proposal .pl{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--red);margin-bottom:5px;}
.proposal .pf{display:block;margin-top:4px;}
.proposal .pf b{font-weight:600;}
.proposal .lbl{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mid);}
.lock-row{align-self:flex-end;}
.lock-btn{background:var(--red);color:#fff;border:none;border-radius:var(--radius-pill);padding:8px 18px;font-size:12px;font-weight:700;letter-spacing:.3px;cursor:pointer;}
.lock-btn:hover{background:var(--red-dark);}
.thinking{display:flex;gap:4px;align-self:flex-start;padding:9px 12px;}
.thinking span{width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite;}
.thinking span:nth-child(2){animation-delay:.2s;} .thinking span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
.dp-foot{display:flex;gap:8px;padding:12px 14px;border-top:.5px solid var(--card-border);}
.dp-input{flex:1;border:.5px solid var(--card-border);border-radius:20px;padding:9px 14px;font-size:12px;outline:none;font-family:inherit;}
.dp-input:focus{border-color:var(--red);}
.dp-send{background:var(--ink);color:#fff;border:none;border-radius:20px;padding:9px 16px;font-size:11px;font-weight:700;cursor:pointer;}
.dp-send:hover{background:var(--red);}

.prompt-drawer{position:fixed;top:0;right:0;width:440px;max-width:90vw;height:100vh;background:#10100f;color:#e9e7e3;transform:translateX(100%);transition:transform .35s ease;z-index:30;display:flex;flex-direction:column;}
.prompt-drawer.open{transform:translateX(0);box-shadow:-10px 0 40px rgba(0,0,0,.4);}
.pd-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.1);}
.pd-head .t{font-family:'Bebas Neue';letter-spacing:2px;font-size:18px;}
.pd-head button{margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
.pd-body{flex:1;overflow:auto;padding:16px 18px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.6;white-space:pre-wrap;color:#cfcdc8;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;opacity:0;transition:all .3s;z-index:40;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:920px){
  .stage{flex-direction:column;align-items:center;}
  .rail{position:static;flex:none;width:100%;max-width:600px;max-height:none;}
}
</style>
</head>
<body>

<div class="lab-bar">
  <span class="tag">REVISE LAB</span>
  <span class="muted">canned Neon profile · live <b>/api/revise</b> · highlight a line or hit a pencil</span>
  <span class="spacer"></span>
  <button onclick="resetProfile()">Reset</button>
</div>

<div class="stage" id="stage">
  <div class="cardwrap"><div class="profile-zone" id="profileZone"></div></div>

  <div class="rail" id="rail">
    <div class="rail-head" id="railHead"></div>
    <div class="rail-idle" id="railIdle"></div>
    <div class="rail-chat" id="railChat">
      <div class="dp-head">
        <div class="dp-dot">D</div>
        <div><div class="dp-title">Dot</div><div class="dp-sub" id="dpSub">Tweaking a block</div></div>
        <button class="dp-x" onclick="closePanel()">&times;</button>
      </div>
      <div class="dp-body" id="dpBody"></div>
      <div class="dp-foot">
        <input class="dp-input" id="dpInput" placeholder="Tell Dot what to tweak…" onkeydown="if(event.key==='Enter')sendFeedback()">
        <button class="dp-send" onclick="sendFeedback()">Send</button>
      </div>
    </div>
    <div class="rail-foot" id="railFoot"></div>
  </div>
</div>

<div class="prompt-drawer" id="promptDrawer">
  <div class="pd-head"><span class="t" id="pdTitle">YOUR NEON PROMPT</span><button onclick="togglePrompt()">&times;</button></div>
  <div class="pd-body" id="pdBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const OPENERS = {
  brand:      p => `This is your Brand — the whole voice in a paragraph.\n\nWhat do you want to tweak?`,
  brandHi:    (p,h) => `You've highlighted “${h}” in your Brand.\n\nWhat do you want to tweak?`,
  behaviours: (p,i) => `This is a Who-we-are pair — “${p.behaviours[i].we}” against “${p.behaviours[i].not}”.\n\nWhat do you want to tweak?`,
  behavioursHi:(p,i,h) => `You've highlighted “${h}”.\n\nWhat do you want to tweak?`,
  examples:   (p,i) => `This is a More / Less example.\n\nWhat do you want to tweak?`,
  examplesHi: (p,i,h) => `You've highlighted “${h}”.\n\nWhat do you want to tweak?`,
  houseRules: (p,i) => `This is your “${p.houseRules[i].key}” rule.\n\nWhat do you want to tweak?`,
  houseRulesHi:(p,i,h) => `You've highlighted “${h}” in the “${p.houseRules[i].key}” rule.\n\nWhat do you want to tweak?`,
};

const SEED = {
  brandName: "Neon",
  descriptors: ["Opinionated", "Warm", "Unbothered"],
  brand: "Neon writes like the friend who's already three episodes in and won't shut up about it — opinionated, warm, pulling you toward something rather than pitching it at you. The voice runs on conviction: it has a take, it backs the take, and it's comfortable if you push back. The reader doesn't feel marketed to; they feel let in.",
  behaviours: [
    { we: "The one who's already seen it and can't help saying so", not: "The critic building a case for the record" },
    { we: "The person already in the group chat when you arrive", not: "The host who called the meeting" },
    { we: "The Kiwi who just tells you straight, no performance required", not: "The hype merchant working the room" }
  ],
  examples: [
    { more: "We've called it. Three episodes in and it's already the one. You'll catch up.", less: "We think this could be one to watch this weekend." },
    { more: "Not everyone's going to love this ending. We did. Come fight us.", less: "This show has a surprising ending that's getting people talking." },
    { more: "You didn't know you needed a slow-burn New Zealand thriller. Now you do.", less: "Discover something different with this locally made drama." },
    { more: "It's good. Like, properly. No further explanation needed.", less: "This one comes highly recommended and is definitely worth checking out." },
    { more: "Skip the scroll. This is the one we'd put on tonight.", less: "Here's a great option if you're looking for something to stream." }
  ],
  houseRules: [
    { key: "No try-hard Kiwi", rule: "Never use 'sweet as', 'bro', 'chur' or any phrase that signals New Zealand-ness by name. The Kiwi register shows in attitude — understatement, directness, lightness — not in markers." },
    { key: "Conviction, not hype", rule: "Avoid exclamation marks as a substitute for energy. The voice earns its enthusiasm through a clear take, not punctuation or volume. If a line needs an exclamation mark to land, rewrite the line." },
    { key: "Have a take", rule: "Every recommendation carries an opinion. Never hedge with 'might', 'could be', or 'something for everyone'. If we're recommending it, we've decided." }
  ]
};

let profileData = JSON.parse(JSON.stringify(SEED));
let active = null;
let history = [];
let currentProposal = null;
let tweaks = [];          // in-session tweak log: {label, why, before, after}
let view = 'profile';     // card face: 'profile' (pretty) | 'prompt' (raw)

const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const PENCIL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
const SVG_PDF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
const SVG_PROMPT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>`;
const SVG_DL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

function diffWords(oldS, newS){
  const tok = s => (s||'').split(/(\s+)/);
  const o = tok(oldS), n = tok(newS);
  const m = o.length, k = n.length;
  const dp = Array.from({length:m+1}, ()=>new Array(k+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=k-1;j>=0;j--)
    dp[i][j] = o[i]===n[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0, j=0, out='';
  while(j<k){
    if(i<m && o[i]===n[j]){ out+=esc(n[j]); i++; j++; }
    else if(i<m && dp[i+1][j] >= dp[i][j+1]){ i++; }
    else { out += n[j].trim()==='' ? esc(n[j]) : '<mark class="changed">'+esc(n[j])+'</mark>'; j++; }
  }
  return out;
}

/* ── the artefact (card), now button-free ─────────────────────── */
function render(){
  const p = profileData, bn = p.brandName || 'Brand';
  const titleWord = view==='prompt' ? 'PROMPT' : 'VOICE';
  let h = `<div class="profile-header">
    <div class="profile-title">YOUR <span>${esc(bn.toUpperCase())}</span> ${titleWord}</div>
    <div class="view-toggle" data-noexport>
      <button class="vt ${view==='profile'?'active':''}" onclick="setView('profile')">Profile</button>
      <button class="vt ${view==='prompt'?'active':''}" onclick="setView('prompt')">Prompt</button>
    </div>
  </div>`;

  if(view==='prompt'){
    h += `<div class="prompt-view">${esc(buildPromptMd())}</div>`;
    document.getElementById('profileZone').innerHTML = h;
    return;
  }

  let threeW = '';
  if(p.descriptors && p.descriptors.length){
    const ws = p.descriptors.map(w=>esc(w.toLowerCase()));
    const list = ws.length>1 ? ws.slice(0,-1).join(', ')+' and '+ws[ws.length-1] : ws[0];
    threeW = ` ${esc(bn)} is ${list}.`;
  }
  h += `<div class="psec editable" data-section="brand" data-index="0">
    <button class="pencil" title="Tweak">${PENCIL}</button>
    <div class="plbl">Brand Voice</div>
    <div class="pbody"><span data-text data-field="brand">${esc(p.brand)}</span>${threeW}</div></div>`;

  h += `<div class="psec"><div class="plbl">Who we are</div><table class="ptable">
    <tr><th>We are</th><th>We're not</th></tr>` +
    p.behaviours.map((b,i)=>`<tr class="editable" data-section="behaviours" data-index="${i}">
      <td data-text data-field="we">${esc(b.we)}</td><td class="foil" data-text data-field="not">${esc(b.not)}<button class="pencil" title="Tweak">${PENCIL}</button></td></tr>`).join('') +
    `</table></div>`;

  h += `<div class="psec"><div class="plbl">Examples</div><table class="ptable">
    <tr><th>More this</th><th>Less this</th></tr>` +
    p.examples.map((e,i)=>`<tr class="editable" data-section="examples" data-index="${i}">
      <td data-text data-field="more">${esc(e.more)}</td><td class="foil" data-text data-field="less">${esc(e.less)}<button class="pencil" title="Tweak">${PENCIL}</button></td></tr>`).join('') +
    `</table></div>`;

  h += `<div class="psec"><div class="plbl">House Rules</div><div class="rules-list">` +
    p.houseRules.map((r,i)=>`<div class="rule-item editable" data-section="houseRules" data-index="${i}">
      <span class="rule-key" data-text data-field="key">${esc(r.key)}</span><span class="rule-val" data-text data-field="rule">${esc(r.rule)}</span>
      <button class="pencil" title="Tweak">${PENCIL}</button></div>`).join('') +
    `</div></div>`;

  h += `<div class="psec footer-row"><img src="images/ai2-logo.png" alt="hai2" class="footer-logo"><span class="footer-note">Remember, robots are clever, but always keep a human in the loop.</span></div>`;

  document.getElementById('profileZone').innerHTML = h;
  document.querySelectorAll('.editable').forEach(el=>{
    el.querySelector('.pencil').addEventListener('click', ev=>{
      ev.stopPropagation();
      open(el.dataset.section, +el.dataset.index, highlightWithin(el));
    });
  });
  refreshPrompt();
}

/* ── the hero — persistent, stays put while Dot grows ─────────── */
function renderHead(){
  document.getElementById('railHead').innerHTML = `<div class="sc-hero">
      <div class="sc-eyebrow">Quick sensecheck</div>
      <div class="sc-hed">Tick it.<br><span class="tweak">Or tweak it.</span></div>
      <div class="sc-intro">Here's our take on your voice.</div>
    </div>`;
}

/* ── Dot's section, at rest (becomes the chat when live) ──────── */
function renderRail(){
  let h = `<div class="sc-dot">
      <div class="sc-dot-av">D</div>
      <div class="sc-dot-bubble">See something worth fixing?<br>Just highlight it and let's chat.</div>
    </div>`;

  if(tweaks.length){
    h += `<div class="tweaks-made" id="tweaksMade">
        <button class="tm-head" onclick="document.getElementById('tweaksMade').classList.toggle('open')">
          <span class="tm-count"><span class="tick">✓</span> ${tweaks.length} tweak${tweaks.length>1?'s':''} made</span>
          <span class="tm-chev">▾</span>
        </button>
        <div class="tm-list">` +
        tweaks.map(t=>`<div class="tw-item"><div class="tw-lbl">${esc(t.label)}</div><div class="tw-why">${esc(t.why)}</div></div>`).join('') +
        `</div></div>`;
  }

  document.getElementById('railIdle').innerHTML = h;
}

/* the exit — persistent footer, survives the chat */
function renderFoot(){
  document.getElementById('railFoot').innerHTML = `<div class="gtg">
      <div class="gtg-hed">Good to go?</div>
      <button class="dl-btn" onclick="downloadStub('PDF + prompt')">${SVG_DL} Download</button>
    </div>`;
}
function downloadStub(kind){ toast(kind+' export lives in the real app'); }

/* ── highlighter ──────────────────────────────────────────────── */
function highlightWithin(el){
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed) return '';
  const txt = sel.toString().trim();
  if(!txt) return '';
  const anc = sel.getRangeAt(0).commonAncestorContainer;
  const node = anc.nodeType === 3 ? anc.parentElement : anc;
  return el.contains(node) ? txt : '';
}
document.addEventListener('mouseup', ()=>{
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed) return;
  const txt = sel.toString().trim();
  if(!txt) return;
  const anc = sel.getRangeAt(0).commonAncestorContainer;
  const node = anc.nodeType === 3 ? anc.parentElement : anc;
  const el = node && node.closest ? node.closest('.editable') : null;
  if(!el) return;
  // ignore re-selecting the exact same block + highlight; otherwise replace
  if(active && active.section===el.dataset.section && active.index===+el.dataset.index && active.highlight===txt) return;
  open(el.dataset.section, +el.dataset.index, txt);
});
function litHighlight(section, index, hl){
  if(!hl) return;
  const el = blockEl(section,index);
  if(!el) return;
  for(const node of el.querySelectorAll('[data-text]')){
    const t = node.textContent;
    const i = t.indexOf(hl);
    if(i >= 0){ node.innerHTML = esc(t.slice(0,i))+'<mark class="hl">'+esc(hl)+'</mark>'+esc(t.slice(i+hl.length)); break; }
  }
}

function blockValue(section,index){ return section==='brand' ? profileData.brand : profileData[section][index]; }
function blockEl(section,index){ return document.querySelector(`.editable[data-section="${section}"][data-index="${index}"]`); }

function open(section, index, highlight){
  if(active){ const prev = active; active = null; restoreBlock(prev.section, prev.index); }
  clearActive();
  active = { section, index, highlight: highlight||'', lastReason:'' };
  history = []; currentProposal = null;
  const el = blockEl(section,index);
  if(el) el.classList.add('active');
  if(highlight) litHighlight(section, index, highlight);

  let opener;
  const hk = section+'Hi';
  if(highlight && OPENERS[hk]) opener = section==='brand' ? OPENERS.brandHi(profileData,highlight) : OPENERS[hk](profileData,index,highlight);
  else opener = section==='brand' ? OPENERS.brand(profileData) : OPENERS[section](profileData,index);
  active.opener = opener;

  document.getElementById('dpSub').textContent = subLabel(section,index);
  document.getElementById('dpBody').innerHTML = '';
  addMsg('dot', opener);
  document.getElementById('stage').classList.add('editing');
  setTimeout(()=>document.getElementById('dpInput').focus(), 200);
}
function subLabel(section,index){
  if(section==='brand') return 'Brand Voice';
  if(section==='behaviours') return 'Who we are · row '+(index+1);
  if(section==='examples') return 'Examples · row '+(index+1);
  if(section==='houseRules') return profileData.houseRules[index].key;
  return section;
}
function clearActive(){
  document.querySelectorAll('.editable.active, .editable.preview').forEach(e=>e.classList.remove('active','preview'));
}
function closePanel(){
  document.getElementById('stage').classList.remove('editing');
  active = null; currentProposal = null; history = [];
  render(); renderRail();
}

/* ── chat ─────────────────────────────────────────────────────── */
function addMsg(who, text, opts={}){
  const body = document.getElementById('dpBody');
  const d = document.createElement('div');
  d.className = 'msg '+who+(opts.pb?' pb':'');
  d.textContent = text;
  body.appendChild(d); body.scrollTop = body.scrollHeight;
}
function addProposal(section, index, prop){
  const body = document.getElementById('dpBody');
  const cur = blockValue(section, index);
  let inner = '';
  if(section==='brand') inner = `<span class="pf">${diffWords(cur, typeof prop==='string'?prop:(prop.brand||''))}</span>`;
  else if(section==='behaviours') inner = `<span class="pf"><span class="lbl">We are</span> ${diffWords(cur.we, prop.we||'')}</span><span class="pf"><span class="lbl">We're not</span> ${diffWords(cur.not, prop.not||'')}</span>`;
  else if(section==='examples') inner = `<span class="pf"><span class="lbl">More</span> ${diffWords(cur.more, prop.more||'')}</span><span class="pf"><span class="lbl">Less</span> ${diffWords(cur.less, prop.less||'')}</span>`;
  else if(section==='houseRules') inner = `<span class="pf"><b>${diffWords(cur.key, prop.key||cur.key)}</b></span><span class="pf">${diffWords(cur.rule, prop.rule||'')}</span>`;
  const card = document.createElement('div'); card.className='proposal';
  card.innerHTML = `<div class="pl">Proposed</div>${inner}`;
  body.appendChild(card);
  const row = document.createElement('div'); row.className='lock-row';
  const b = document.createElement('button'); b.className='lock-btn'; b.textContent='✓ Lock this?'; b.onclick=commit;
  row.appendChild(b); body.appendChild(row); body.scrollTop = body.scrollHeight;
}
function thinking(on){
  const body = document.getElementById('dpBody');
  let t = document.getElementById('thinkingDots');
  if(on){ if(t) return; t=document.createElement('div'); t.id='thinkingDots'; t.className='thinking';
    t.innerHTML='<span></span><span></span><span></span>'; body.appendChild(t); body.scrollTop=body.scrollHeight; }
  else if(t){ t.remove(); }
}
async function sendFeedback(){
  const inp = document.getElementById('dpInput');
  const text = inp.value.trim();
  if(!text || !active) return;
  inp.value=''; addMsg('me', text);
  history.push({role:'user', content:text});
  thinking(true);
  try{
    const res = await fetch('/api/revise', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        profile: profileData,
        target:{section:active.section, index:active.index},
        blockValue: blockValue(active.section, active.index),
        highlight: active.highlight || null,
        opener: active.opener, history
      })
    });
    const data = await res.json();
    thinking(false);
    if(!data.success){ addMsg('dot', data.error || "Something went sideways. Try again?"); return; }
    history.push({role:'assistant', content:data.message});
    if(data.proposal){
      currentProposal = data.proposal; active.lastReason = data.message || '';
      if(data.message) addMsg('dot', data.message);
      addProposal(active.section, active.index, data.proposal);
      preview(active.section, active.index, data.proposal);
    } else { currentProposal=null; restoreBlock(active.section, active.index); addMsg('dot', data.message, {pb:data.pushback}); }
  }catch(err){ thinking(false); addMsg('dot', "Couldn't reach the engine — is the API key set? ("+err.message+")"); }
}

/* ── preview on the card (DOM only) ───────────────────────────── */
function setField(el, field, html){ const n = el.querySelector(`[data-field="${field}"]`); if(n) n.innerHTML = html; }
function preview(section, index, prop){
  const el = blockEl(section,index); if(!el) return;
  el.classList.remove('active'); el.classList.add('preview');
  const cur = blockValue(section,index);
  if(section==='brand') setField(el,'brand', diffWords(cur, typeof prop==='string'?prop:(prop.brand||'')));
  else if(section==='behaviours'){ setField(el,'we', diffWords(cur.we, prop.we||'')); setField(el,'not', diffWords(cur.not, prop.not||'')); keepPencil(el,'not'); }
  else if(section==='examples'){ setField(el,'more', diffWords(cur.more, prop.more||'')); setField(el,'less', diffWords(cur.less, prop.less||'')); keepPencil(el,'less'); }
  else if(section==='houseRules'){ setField(el,'key', diffWords(cur.key, prop.key||cur.key)); setField(el,'rule', diffWords(cur.rule, prop.rule||'')); }
}
function keepPencil(el, field){
  const node = el.querySelector(`[data-field="${field}"]`);
  if(node && !node.querySelector('.pencil')){
    const b = document.createElement('button'); b.className='pencil'; b.title='Tweak'; b.innerHTML=PENCIL;
    b.addEventListener('click', ev=>{ ev.stopPropagation(); open(el.dataset.section,+el.dataset.index,''); });
    node.appendChild(b);
  }
}
function restoreBlock(section,index){
  const el = blockEl(section,index); if(!el) return;
  el.classList.remove('preview'); el.classList.add('active');
  const cur = blockValue(section,index);
  if(section==='brand') setField(el,'brand', esc(cur));
  else if(section==='behaviours'){ setField(el,'we',esc(cur.we)); setField(el,'not',esc(cur.not)); keepPencil(el,'not'); }
  else if(section==='examples'){ setField(el,'more',esc(cur.more)); setField(el,'less',esc(cur.less)); keepPencil(el,'less'); }
  else if(section==='houseRules'){ setField(el,'key',esc(cur.key)); setField(el,'rule',esc(cur.rule)); }
  if(active && active.highlight) litHighlight(section,index,active.highlight);
}

/* ── commit: Lock writes to truth + logs the tweak ────────────── */
function commit(){
  if(!active || !currentProposal) return;
  const {section,index} = active;
  const before = JSON.parse(JSON.stringify(blockValue(section,index)));
  if(section==='brand') profileData.brand = typeof currentProposal==='string' ? currentProposal : (currentProposal.brand||profileData.brand);
  else profileData[section][index] = currentProposal;

  tweaks.push({
    label: subLabel(section,index),
    why: active.lastReason || 'Tweaked.',
    before, after: JSON.parse(JSON.stringify(currentProposal))
  });

  currentProposal = null;
  addMsg('dot', "Locked in. Profile and prompt both updated.");
  render(); pulsePrompt(); toast('Locked in');
  setTimeout(closePanel, 650);
}

/* ── second render: the prompt ────────────────────────────────── */
function buildPromptMd(){
  const p = profileData, bn = p.brandName || 'this brand';
  let md = `You are crafting communications for **${bn}**. Your job is to write in their voice.`;
  if(p.descriptors && p.descriptors.length) md += ` Think, ${p.descriptors.join(', ')}.`;
  md += `\n\n---\n\n`;
  md += `## Brand\n\n${p.brand}\n\n`;
  md += `## Who we are\n\n${p.behaviours.map(b=>`- **Are:** ${b.we}\n  **Are not:** ${b.not}`).join('\n')}\n\n`;
  md += `## Write more like this\n\n${p.examples.map(e=>`- ✓ ${e.more}\n  ✗ ${e.less}`).join('\n')}\n\n`;
  md += `## House rules\n\n${p.houseRules.map(r=>`- **${r.key}:** ${r.rule}`).join('\n')}\n\n---\n\nNow write like this. Every time. No exceptions.`;
  return md;
}
function refreshPrompt(){
  document.getElementById('pdBody').textContent = buildPromptMd();
  const t = document.getElementById('pdTitle');
  if(t) t.textContent = `YOUR ${(profileData.brandName||'BRAND').toUpperCase()} PROMPT`;
}
function togglePrompt(){ document.getElementById('promptDrawer').classList.toggle('open'); refreshPrompt(); }
function setView(v){ if(view===v) return; view=v; active=null; document.getElementById('stage').classList.remove('editing'); render(); }
function pulsePrompt(){ refreshPrompt(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1700); }
function resetProfile(){ profileData = JSON.parse(JSON.stringify(SEED)); active=null; tweaks=[]; document.getElementById('stage').classList.remove('editing'); render(); renderRail(); toast('Profile reset'); }

render(); renderRail(); renderHead(); renderFoot();
</script>
